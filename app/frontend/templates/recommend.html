<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Game recommendation system</title>
</head>
<body class="bg-dark">

<div class="container py-5">

    <h1 class="text-center mb-3">Game Recommendation</h1>
    <p class="text-center text-secondary mb-5">Enter a game title to get 10 similar game recommendations.</p>

    <form action="/recommend" method="post" class="row justify-content-center mb-5">

        <div class="col-md-6">
            <input type="text" class="form-control form-control-lg {% if error %}is-invalid{% endif %}" name="game_name" value="{{ game_name }}" placeholder="Enter game name..." required>

            {% if error %}
                <div class="invalid-feedback">{{ error }}</div>
            {% endif %}
        </div>

        <div class="col-auto">
            <button type="submit" class="btn btn-primary btn-lg">Recommend</button>
        </div>

    </form>

    {% if similar_games %}
    <h3 class="mb-4">Recommended Games</h3>

    <div class="row g-4">

        {% for game in similar_games %}
        <div class="col-md-4 col-lg-3">
            <div class="card h-100 shadow">

                <img src="{{ game.image_url }}" class="card-img-top" alt="{{ game.name }}" style="height:300px; object-fit:cover;" loading="lazy">

                <div class="card-body">
                    <h5 class="card-title text-center">{{ game.name }}</h5>
                </div>

            </div>
        </div>
        {% endfor %}

    </div>
    {% endif %}

</div>

</body>
</html>
